name: Build Sapp APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Sapp project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          bundle = Path("Sapp-project.txt")
          if not bundle.exists():
              raise SystemExit("Sapp-project.txt is missing")

          text = bundle.read_text(encoding="utf-8")
          parts = re.split(r'^=====(FILE|B64) (.+?)=====\n', text, flags=re.M)

          if len(parts) < 4:
              raise SystemExit("Invalid Sapp-project.txt bundle")

          count = 0
          for i in range(1, len(parts), 3):
              kind = parts[i]
              path = parts[i + 1]
              body = parts[i + 2]

              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)

              if kind == "B64":
                  p.write_bytes(base64.b64decode("".join(body.split())))
              else:
                  p.write_text(body.lstrip("\ufeff\r\n"), encoding="utf-8")

              count += 1
              print("Extracted:", path)

          required = [
              "settings.gradle",
              "build.gradle",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/java/com/studentplanner/app/MainActivity.java",
              "app/src/main/java/com/studentplanner/app/ReminderReceiver.java",
          ]

          for path in required:
              if not Path(path).exists():
                  raise SystemExit(f"Missing required file: {path}")

          print(f"Extracted {count} project files successfully.")

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No APK was produced."
            exit 1
          fi
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload Sapp APK
        uses: actions/upload-artifact@v4
        with:
          name: Sapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
